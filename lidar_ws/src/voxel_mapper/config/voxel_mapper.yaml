lidar_preprocessor:
  ros__parameters:
    input_topic: /velodyne_points
    sensor_frame: velodyne
    target_frame: base_link
    range_min: 0.5
    range_max: 50.0
    # VLP-16's 16 lasers already span exactly -15/+15 deg; this is a
    # safety net, not an active crop, unless the sensor changes.
    vertical_fov_min_deg: -15.0
    vertical_fov_max_deg: 15.0
    downsample_voxel_size: 0.2
    ransac_iterations: 50
    ransac_candidate_band: 0.5
    ransac_distance_threshold: 0.1
    # Matches voxel_mapper's z_min/z_max below exactly, so the full 6 ft
    # band above the grid's lowest point is actually usable.
    height_band_min: -1.0
    height_band_max: 0.83
    sensor_timeout_sec: 0.5

voxel_mapper:
  ros__parameters:
    resolution: 0.3
    x_min: -20.0
    x_max: 20.0
    y_min: -20.0
    y_max: 20.0
    z_min: -1.0
    # 6 ft (1.8288 m) above z_min -- the grid only sees 6 ft above its
    # lowest point.
    z_max: 0.83
    persistence_sec: 2.0
    decay_rate_hz: 2.0
    inflation_radius: 1.2
    enable_raycasting: true
    hit_logodds: 0.85
    miss_logodds: -0.4
    logodds_min: -0.8
    logodds_max: 2.0
