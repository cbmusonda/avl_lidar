lidar_preprocessor:
  ros__parameters:
    input_topic: /velodyne_points
    sensor_frame: velodyne
    target_frame: base_link
    range_min: 0.5
    range_max: 50.0
    downsample_voxel_size: 0.2
    ransac_iterations: 50
    ransac_candidate_band: 0.5
    ransac_distance_threshold: 0.1
    height_band_min: -0.8
    height_band_max: 3.0
    sensor_timeout_sec: 0.5

voxel_mapper:
  ros__parameters:
    resolution: 0.3
    x_min: -20.0
    x_max: 20.0
    y_min: -20.0
    y_max: 20.0
    z_min: -1.0
    z_max: 3.0
    persistence_sec: 2.0
    decay_rate_hz: 2.0
    inflation_radius: 1.2
    enable_raycasting: true
